name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


env:
  IMAGE_NAME: ghcr.io/silver68211/mlops-churn-api


jobs:

  # ------------------------------------------------
  # CI: tests
  # ------------------------------------------------

  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -v -m "not integration"


  # ------------------------------------------------
  # CD stage 1: build and publish image
  # ------------------------------------------------

  build-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    needs:
      - test

    # Only publish images after a push to main.
    # Pull requests only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"


  # ------------------------------------------------
  # CD stage 2: deploy
  # ------------------------------------------------

  deploy:
    name: Deploy application
    runs-on: ubuntu-latest

    needs:
      - build-push

    environment:
      name: production

    steps:

      # --------------------------------------------
      # Check whether GitHub can reach the SSH server
      # --------------------------------------------

      - name: Test deployment server connectivity
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          echo "Testing SSH connectivity to deployment server..."
          nc -vz -w 10 "$DEPLOY_HOST" 22


      # --------------------------------------------
      # Configure SSH
      # --------------------------------------------

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "$DEPLOY_SSH_KEY" \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan \
            -T 10 \
            -H "$DEPLOY_HOST" \
            >> ~/.ssh/known_hosts


      # --------------------------------------------
      # Deploy container
      # --------------------------------------------

      - name: Deploy new container
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          ssh \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "GHCR_USERNAME='$GHCR_USERNAME' \
             GHCR_READ_TOKEN='$GHCR_READ_TOKEN' \
             MLFLOW_TRACKING_URI='$MLFLOW_TRACKING_URI' \
             IMAGE_SHA='${{ github.sha }}' \
             bash -s" << 'EOF'

          set -e

          IMAGE_NAME="ghcr.io/silver68211/mlops-churn-api"

          echo "Logging in to GitHub Container Registry..."

          echo "$GHCR_READ_TOKEN" \
            | docker login ghcr.io \
                -u "$GHCR_USERNAME" \
                --password-stdin


          echo "Pulling new Docker image..."

          docker pull \
            "$IMAGE_NAME:$IMAGE_SHA"


          echo "Removing old container if it exists..."

          docker rm \
            -f mlops-churn-api \
            2>/dev/null || true


          echo "Starting new container..."

          docker run \
            -d \
            --name mlops-churn-api \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p 8000:8000 \
            -e MLFLOW_TRACKING_URI="$MLFLOW_TRACKING_URI" \
            -e MODEL_URI="models:/churn_classifier@candidate" \
            -e DECISION_THRESHOLD="0.50" \
            "$IMAGE_NAME:$IMAGE_SHA"


          echo "Waiting for API startup..."

          sleep 10


          echo "Running health check..."

          curl \
            --fail \
            --retry 5 \
            --retry-delay 3 \
            http://127.0.0.1:8000/health


          echo "Deployment successful."

          EOF