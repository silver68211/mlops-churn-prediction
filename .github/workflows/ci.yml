name: CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read
  packages: write


env:
  IMAGE_NAME: ghcr.io/silver68211/mlops-churn-api


jobs:

  # ------------------------------------------------
  # CI: run tests
  # ------------------------------------------------

  test:
    name: Run tests

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: |
          pytest -v -m "not integration"


  # ------------------------------------------------
  # CD stage 1: build and publish Docker image
  # ------------------------------------------------

  build-push:
    name: Build and push Docker image

    runs-on: ubuntu-latest

    needs:
      - test

    # Only build/publish after a push to main.
    # Pull requests only run tests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "$IMAGE_NAME:${{ github.sha }}" \
            -t "$IMAGE_NAME:latest" \
            .

      - name: Push Docker image
        run: |
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"


  # ------------------------------------------------
  # CD stage 2: deploy on self-hosted runner
  # ------------------------------------------------

  deploy:
    name: Deploy application

    # This job runs on your Ubuntu laptop.
    runs-on:
      - self-hosted
      - linux
      - x64

    needs:
      - build-push

    environment:
      name: production

    steps:

      # ------------------------------------------------
      # Verify that the runner can use Docker
      # ------------------------------------------------

      - name: Check Docker access
        run: |
          echo "Runner user:"
          whoami

          echo "Groups:"
          groups

          echo "Docker socket:"
          ls -l /var/run/docker.sock

          echo "Docker status:"
          docker ps


      # ------------------------------------------------
      # Authenticate with GitHub Container Registry
      # ------------------------------------------------

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                -u "${{ github.actor }}" \
                --password-stdin


      # ------------------------------------------------
      # Pull the new image
      # ------------------------------------------------

      - name: Pull Docker image
        run: |
          docker pull \
            "$IMAGE_NAME:${{ github.sha }}"


      # ------------------------------------------------
      # Stop previous deployment
      # ------------------------------------------------

      - name: Remove previous container
        run: |
          docker rm \
            -f mlops-churn-api \
            2>/dev/null || true


      # ------------------------------------------------
      # Start new deployment
      # ------------------------------------------------

      - name: Start application
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
        run: |
          docker rm -f mlops-churn-api 2>/dev/null || true
          docker run \
            -d \
            --name mlops-churn-api \
            --restart unless-stopped \
            --add-host=host.docker.internal:host-gateway \
            -p 8000:8000 \
            -e MLFLOW_TRACKING_URI="$MLFLOW_TRACKING_URI" \
            -e MODEL_URI="models:/churn_classifier@candidate" \
            -e DECISION_THRESHOLD="0.50" \
            "$IMAGE_NAME:${{ github.sha }}"


      # ------------------------------------------------
      # Verify deployment
      # ------------------------------------------------

      - name: Health check
        run: |
          echo "Waiting for API startup..."

          sleep 10

          curl \
            --fail \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 3 \
            http://127.0.0.1:8000/health

          echo
          echo "Deployment successful."